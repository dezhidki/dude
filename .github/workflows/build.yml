# Push to main → rolling "nightly" prerelease. Push a tag vX.Y.Z → release vX.Y.Z.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            app/desktop/package-lock.json
      - run: npm ci
      - run: npm ci # the UI build (Vite), lint (Biome) and types (TypeScript)
        working-directory: app
      - name: Lint and types (Biome, TypeScript)
        if: runner.os == 'Linux' # Windows checks out CRLF, which the formatter would flag
        working-directory: app
        run: npm run lint
      - run: npm test
        working-directory: app
      - name: UI smoke test (Electron, Solid's development checks)
        if: runner.os == 'Linux'
        working-directory: app
        run: xvfb-run -a npm run smoke
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run package -- --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: dude-${{ runner.os }}
          path: |
            app/desktop/dist/*.AppImage
            app/desktop/dist/*.dmg
            app/desktop/dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Nightly prerelease
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly out/* --prerelease --target "$GITHUB_SHA" \
            --title "nightly ${GITHUB_SHA::7}" --notes "Latest build of main ($GITHUB_SHA). May be broken."
      - name: Versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" out/* --title "$GITHUB_REF_NAME" --verify-tag --generate-notes

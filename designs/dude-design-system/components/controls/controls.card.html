<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

</head><body><div id="r"></div>
<script type="text/babel">
const { Button, IconButton, ChoiceButton, Segmented, Field, Checkbox, BarInput, Keys } = window.DudeDesignSystem_3fa3b0;
function ControlsSpecimen() {
  const [undo, setUndo] = React.useState(3);
  const [rsvp, setRsvp] = React.useState('yes');
  return (
    <>
      <span className="lb">main · secondary</span>
      <Button variant="main">go</Button>
      <Button variant="secondary">microsoft login</Button>
      <span className="lb">soft · outline · toolbar</span>
      <div className="ln"><Button variant="soft" keyHint="Enter">reply all</Button><Button variant="outline">today</Button><Button variant="toolbar" icon="download">save</Button></div>
      <span className="lb">quiet · caps · save · link · banner</span>
      <div className="ln"><Button variant="quiet" primary>send</Button><Button variant="quiet">later</Button><Button variant="save">save</Button><Button variant="caps">nope</Button><Button variant="caps" danger>delete</Button><Button variant="link">new split</Button></div>
      <div className="ln"><Button variant="banner">2 new mail. show</Button></div>
      <span className="lb">choice · segmented · check</span>
      <div className="ln">{['yes','maybe','no'].map((x) => <ChoiceButton key={x} on={rsvp===x} onClick={() => setRsvp(x)}>{x}</ChoiceButton>)}</div>
      <Segmented value={undo} onChange={setUndo} options={[{value:0,label:'off'},{value:3,label:'3 s'},{value:5,label:'5 s'},{value:10,label:'10 s'}]} />
      <div className="ln"><Checkbox label="weekends" checked /><Checkbox label="week starts monday" /></div>
      <span className="lb">field · bar input · icon buttons · keys</span>
      <Field placeholder="name" defaultValue="You" />

      <div className="ln"><IconButton icon="cal" on title="Calendar (0)" /><IconButton icon="pen" title="Compose (C)" /><IconButton icon="search" title="Search (/)" /><IconButton title="Close (Esc)">✕</IconButton><Keys keys={['G','then','I']} /><Keys keys={['Ctrl','K']} /></div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('r')).render(<div className="cc"><div><ControlsSpecimen /></div><div className="carbon"><ControlsSpecimen /></div></div>);

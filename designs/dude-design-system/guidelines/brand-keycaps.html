<!-- @dsCard group="Brand" viewport="700x150" subtitle="Shortcuts are shown everywhere a command is" name="Keycaps" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Keycaps</title>
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css">
<style>.kc{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;align-items:center}.kc>span:first-child{color:var(--text-2)}.ks{display:inline-flex;gap:4px;align-items:center}</style></head><body><div class="half"><div class="kc">
<span>command</span><span class="ks"><span class="d-key">Ctrl</span><span class="d-key">K</span></span>
<span>go to important</span><span class="ks"><span class="d-key">G</span><small style="font:700 13px var(--mono);color:var(--text-3)">then</small><span class="d-key">I</span></span>
<span>reply all</span><span><span class="d-btn-soft">reply all <span class="d-key">Enter</span></span></span>
</div><div class="carbon kc">
<span>send later</span><span class="ks"><span class="d-key">Ctrl</span><span class="d-key">Shift</span><span class="d-key">L</span></span>
<span>trash</span><span class="ks"><span class="d-key">#</span></span>
<span>toast</span><span><span class="d-toast" style="animation:none">sending… <span class="d-key">Z</span> undo</span></span>
</div></div></body></html>

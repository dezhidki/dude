<!-- @dsCard group="Spacing" viewport="700x190" subtitle="Flat. Hairlines separate; shadows only where light needs lift" name="Depth" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Depth</title>
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css">
<style>.dp{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.dp div{height:84px;padding:10px;font:11px/14px var(--mono);color:var(--text-2);background:var(--pal)}</style></head><body><div class="half"><div><p class="lbl">light</p><div class="dp" style="grid-template-columns:1fr 1fr">
<div style="border:1px solid var(--line-2);border-radius:var(--r-m)">overlay: 1px line-2, no shadow</div>
<div style="box-shadow:var(--shadow-pop);border:1px solid var(--line-2);border-radius:var(--r-m)">suggestions: shadow-pop</div>
<div style="box-shadow:var(--shadow-menu);background:var(--pane)">side menu: shadow-menu</div>
<div style="background:var(--card);border-radius:var(--r-l)">open message: fill only</div></div></div>
<div class="carbon"><p class="lbl">carbon</p><div class="dp" style="grid-template-columns:1fr 1fr">
<div style="border:1px solid var(--line-2);border-radius:var(--r-m)">overlay: 1px line-2, no shadow</div>
<div style="box-shadow:var(--shadow-pop);border:1px solid var(--line-2);border-radius:var(--r-m)">suggestions: shadow-pop</div>
<div style="box-shadow:var(--shadow-menu);background:var(--pane);border-right:1px solid var(--line-2)">side menu: border only</div>
<div style="background:var(--card);border-radius:var(--r-l)">open message: fill only</div></div></div></div>
</body></html>

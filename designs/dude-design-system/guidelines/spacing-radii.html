<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Nearly square. 2, 3, 4px; 6px only for the alert" name="Radii" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css">
<style>.rs{display:flex;gap:28px;align-items:end}.rs div{display:grid;gap:8px;justify-items:start}.rs i{width:96px;height:56px;background:var(--hi);border:1px solid var(--line-2)}</style></head><body><div class="rs">
<div><i style="border-radius:var(--r-s)"></i><code class="lbl">--r-s 2px · rows, keys, buttons</code></div>
<div><i style="border-radius:var(--r-m)"></i><code class="lbl">--r-m 3px · overlays, ibtn</code></div>
<div><i style="border-radius:var(--r-l)"></i><code class="lbl">--r-l 4px · cards, fields</code></div>
<div><i style="border-radius:var(--r-xl);background:var(--alert);border:0"></i><code class="lbl">--r-xl 6px · alert</code></div>
</div></body></html>
